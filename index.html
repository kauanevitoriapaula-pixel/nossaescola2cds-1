<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home | Nossa Escola</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Cabeçalho -->
  <header class="cabecalho-itens">
    <img
      class="cabecalho_imagem"
      src="logo_page.png"
      alt="Logo da página"
    >

    <h1 class="titulo_site">Nossa Escola</h1>

    <div class="sociais">
      <img class="sociais" src="whatsapp.png" alt="WhatsApp da escola">
      <img class="sociais" src="facebook.png" alt="Facebook da escola">
      <img class="sociais" src="instagram.png" alt="Instagram da escola">
    </div>
  </header>

  <!-- Banner -->
  <section class="banner1">
    <img
      class="escola-imagem"
      src="banner.png"
      alt="Banner da escola"
    >
  </section>

  <main>
    <!-- Seção com exatamente 4 estudantes -->
    <section class="estudante">
      <h2 class="estudante_titulo">Alunos em destaque 2026</h2>

      <div class="estudantes_todos">
        <!-- Estudante 1 -->
        <div class="estudante-div">
          <img
            class="estudante-imagem"
            src="estudante_menino_1.png"
            alt="Foto do Aluno 1"
          >

          <h3 class="estudante-nome">Aluno 1</h3>

          <a href="https://cursos.alura.com.br/dashboard">
            <img
              class="estudante-icone"
              src="site_school.png"
              alt="Link do site da escola"
            >
          </a>

          <img
            class="estudante-icone"
            src="instagram.png"
            alt="Instagram"
          >
          <img
            class="estudante-icone"
            src="facebook.png"
            alt="Facebook"
          >
        </div>

        <!-- Estudante 2 -->
        <div class="estudante-div">
          <img
